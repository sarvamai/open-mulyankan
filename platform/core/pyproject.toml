[project]
name = "mulyankan-platform"
version = "0.1.0"
description = "Layer 1 workflow core: FastAPI core-api, hash-chained audit, provider registry"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "mulyankan-spi",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mulyankan_platform"]
