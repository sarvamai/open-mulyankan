# pnpm 11 reads project settings from this file, not from the "pnpm" field in
# package.json. These overrides force patched versions of two packages that
# reach the client through @sarvam/tatva's dependency tree — the same fix
# apps/web applies (see its package.json history and the Trivy gate).
#
# The explicit `packages` entry works around a pnpm bug where a settings-only
# pnpm-workspace.yaml makes every `pnpm run` fail with "packages field missing
# or empty" (pnpm/pnpm#9361). The root package is included either way.
packages:
  - .
overrides:
  jsondiffpatch: 0.7.6
  linkify-it: 5.0.2
# Supply-chain hardening required by the Semgrep gate (same posture as the
# repo-wide pinning): block transitive deps from untrusted sources, let newly
# published versions age for a week before install, and refuse downgrades of
# security settings.
blockExoticSubdeps: true
minimumReleaseAge: 10080
trustPolicy: no-downgrade
