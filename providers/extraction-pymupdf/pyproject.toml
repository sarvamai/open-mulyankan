[project]
name = "mulyankan-provider-pymupdf"
version = "0.1.0"
description = "Reference extraction provider: text, embedded images and page thumbnails from PDFs via PyMuPDF"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "mulyankan-spi",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mulyankan_provider_pymupdf"]
